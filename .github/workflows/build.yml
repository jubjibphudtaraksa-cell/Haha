name: Build FiatAuth
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o FiatAuth-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: FiatAuth/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: FiatAuth
      - uses: actions/upload-artifact@v4
        with:
          name: FiatAuth
          path: FiatAuth/target/FiatAuth.jar
